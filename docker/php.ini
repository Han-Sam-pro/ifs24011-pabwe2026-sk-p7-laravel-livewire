; Pengaturan PHP untuk image produksi (dimuat dari conf.d).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Batas untuk unggah gambar sampul/foto profil dan impor Excel (PhpSpreadsheet butuh memori).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 120

; OPcache: kode tidak dicek ulang tiap request. Rebuild image setelah mengubah kode.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
