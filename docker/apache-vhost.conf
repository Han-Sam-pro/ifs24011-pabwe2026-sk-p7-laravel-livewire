<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log dikirim ke stdout/stderr agar terlihat di `docker logs` dan tab Logs di Render.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
